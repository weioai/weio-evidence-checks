[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weio-evidence-checks"
version = "0.1.0a3"
description = "Read-only MCP consistency checks for supplied OAuth and release evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Weio, Inc."}]
license = {file = "LICENSE"}
dependencies = []
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]

[project.scripts]
weio-connector-readiness = "weio_evidence_checks.cli:connector_main"
weio-production-provenance = "weio_evidence_checks.cli:provenance_main"

[tool.setuptools.packages.find]
where = ["src"]
